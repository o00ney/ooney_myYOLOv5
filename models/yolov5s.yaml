# Ultralytics YOLOv5s object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov5
# Task docs: https://docs.ultralytics.com/tasks/detect
# Example usage: python train.py --cfg yolov5s.yaml --data coco.yaml

# myChanges: C2f, SE

# Parameters
nc: 80
depth_multiple: 1
width_multiple: 1

anchors:
  - [10, 13, 16, 30, 33, 23]
  - [30, 61, 62, 45, 59, 119]
  - [116, 90, 156, 198, 373, 326]

# MobileNetV2 backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [32, 3, 2]],              # 0: /2,  32 channels
    [-1, 1, InvertedResidual, [16, 1, 1]],  # 1: /2,  16 channels
    [-1, 2, InvertedResidual, [24, 2, 6]],  # 2: /4,  24 channels
    [-1, 3, InvertedResidual, [32, 2, 6]],  # 3: /8,  32 channels, P3
    [-1, 4, InvertedResidual, [64, 2, 6]],  # 4: /16, 64 channels
    [-1, 3, InvertedResidual, [96, 1, 6]],  # 5: /16, 96 channels, P4
    [-1, 3, InvertedResidual, [160, 2, 6]], # 6: /32, 160 channels
    [-1, 1, InvertedResidual, [320, 1, 6]], # 7: /32, 320 channels
    [-1, 1, SPPF, [320, 5]],               # 8: /32, 320 channels
  ]

# YOLOv5s head: channels and repeats are already scaled
head:
  [
    [-1, 1, Conv, [256, 1, 1]],                 # 9: /32, 256 channels
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 10: /16
    [[-1, 5], 1, Concat, [1]],                 # 11: 256 + 96 = 352
    [-1, 1, C3, [256, False]],                 # 12: /16, 256 channels

    [-1, 1, Conv, [128, 1, 1]],                # 13: /16, 128 channels
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 14: /8
    [[-1, 3], 1, Concat, [1]],                 # 15: 128 + 32 = 160
    [-1, 1, C3, [128, False]],                 # 16: /8, 128 channels, small

    [-1, 1, Conv, [128, 3, 2]],                # 17: /16, 128 channels
    [[-1, 13], 1, Concat, [1]],                # 18: 128 + 128 = 256
    [-1, 1, C3, [256, False]],                 # 19: /16, 256 channels, medium

    [-1, 1, Conv, [256, 3, 2]],                # 20: /32, 256 channels
    [[-1, 9], 1, Concat, [1]],                 # 21: 256 + 256 = 512
    [-1, 1, C3, [512, False]],                 # 22: /32, 512 channels, large

    [[16, 19, 22], 1, Detect, [nc, anchors]],   # 23
  ]